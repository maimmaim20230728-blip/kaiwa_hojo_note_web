<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e9e6b">
<title>会話補助ノート・そよぎ</title>

<meta property="og:title" content="会話補助ノート・そよぎ">
<meta property="og:description" content="みせて・さして・つたえる、会話をたすけるノート。はい/いいえ・体調・写真・数字・文字で伝える。オフライン・登録なし・広告なし・無料・12言語。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kaiwa-hojo-note-web.vercel.app/">
<meta property="og:image" content="https://kaiwa-hojo-note-web.vercel.app/icons/fc-card-3x2.png">
<meta name="twitter:card" content="summary_large_image">
<!-- Farcaster Mini App 埋め込み（タイムラインで画像＋ボタン→タップで起動）🔴web側専用・Play側(www)に入れない -->
<meta name="fc:miniapp" content='{"version":"1","imageUrl":"https://kaiwa-hojo-note-web.vercel.app/icons/fc-card-3x2.png","button":{"title":"🗒️ ひらく / Open","action":{"type":"launch_miniapp","name":"会話補助ノート・そよぎ","url":"https://kaiwa-hojo-note-web.vercel.app/","splashImageUrl":"https://kaiwa-hojo-note-web.vercel.app/icons/icon-512.png","splashBackgroundColor":"#2e9e6b"}}}' />
<meta name="fc:frame" content='{"version":"1","imageUrl":"https://kaiwa-hojo-note-web.vercel.app/icons/fc-card-3x2.png","button":{"title":"🗒️ ひらく / Open","action":{"type":"launch_frame","name":"会話補助ノート・そよぎ","url":"https://kaiwa-hojo-note-web.vercel.app/","splashImageUrl":"https://kaiwa-hojo-note-web.vercel.app/icons/icon-512.png","splashBackgroundColor":"#2e9e6b"}}}' />
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="fs0">
<header id="hd">
  <div id="hd-title">会話補助ノート・そよぎ</div>
  <div id="hd-right">
    <div id="hd-lock-wrap">
      <span id="hd-lock-hint" class="hd-lock-hint">せっていはロックを解除</span>
      <button id="hd-lock" class="hd-lock" aria-label="creation mode lock">🔒</button>
    </div>
    <div id="lang-wrap">
      <span class="lang-label">Language</span>
      <select id="set-lang" aria-label="Language 言語">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="it">Italiano</option>
        <option value="pt">Português</option>
        <option value="nl">Nederlands</option>
        <option value="sv">Svenska</option>
        <option value="ko">한국어</option>
        <option value="zh">简体中文</option>
        <option value="ar">العربية</option>
      </select>
    </div>
  </div>
</header>

<main id="main">

  <!-- ホーム(既定表示・5カテゴリの入口。ヘッダーの名前タップでいつでも戻れる) -->
  <section id="scr-home" class="screen">
    <div class="home-wrap">
      <div id="home-logo" class="home-logo" aria-hidden="true">🗒️</div>
      <h1 id="home-name" class="home-name">会話補助ノート・そよぎ</h1>
      <p id="home-tagline" class="home-tagline"></p>
      <p id="home-welcome" class="home-welcome"></p>
      <!-- ホームの大ボタン(5カテゴリ・app.jsが動的生成。フッターナビと同じ行き先) -->
      <div id="home-cats" class="home-cats"></div>
    </div>
  </section>

  <!-- カテゴリ5画面(中身は screens/*.js が並行で実装。v0.1はタイトルのみのプレースホルダー) -->
  <section id="scr-yesno"  class="screen hidden placeholder-screen" data-screen="yesno"></section>
  <section id="scr-health" class="screen hidden placeholder-screen" data-screen="health"></section>
  <section id="scr-photo"  class="screen hidden placeholder-screen" data-screen="photo"></section>
  <section id="scr-number" class="screen hidden placeholder-screen" data-screen="number"></section>
  <section id="scr-kana"   class="screen hidden placeholder-screen" data-screen="kana"></section>

  <!-- せってい(作成モードでのみナビに現れる。項目は置くが動作は最小) -->
  <section id="scr-set" class="screen hidden">
    <div class="lock-row">
      <span id="lock-note" class="hint"></span>
      <div class="set-row"><span id="lbl-tapn"></span><button id="btn-tapn" class="set-btn"></button></div>
      <button id="btn-lock" class="ghost-btn lock-btn"></button>
    </div>

    <h2 id="set-h-normal" class="sec-h"></h2>
    <div class="set-row"><span id="lbl-fs"></span><button id="btn-fs" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-showtext"></span><button id="btn-showtext" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-tts"></span><button id="btn-tts" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-weakside"></span><button id="btn-weakside" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-theme"></span><button id="btn-theme" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-bgm"></span><button id="btn-bgm" class="set-btn"></button></div>
    <div class="set-row"><span id="lbl-vol"></span><button id="btn-vol" class="set-btn"></button></div>

    <h2 id="set-h-backup" class="sec-h"></h2>
    <p id="bk-hint" class="hint"></p>
    <div class="bk-row">
      <button id="bk-export" class="set-btn"></button>
      <button id="bk-import" class="set-btn"></button>
    </div>
    <input id="bk-file" type="file" accept="application/json,.json" class="hidden">

    <p class="credit"><a id="link-privacy" href="privacy.html"></a></p>
    <p class="credit"><a id="about-credit" href="https://soyogi.hp.peraichi.com/top" target="_blank" rel="noopener"></a></p>
    <p id="about-ver" class="credit"></p>
  </section>

</main>

<nav id="navbar">
  <button id="nav-yesno"  class="nav-btn" data-screen="yesno"></button>
  <button id="nav-health" class="nav-btn" data-screen="health"></button>
  <button id="nav-photo"  class="nav-btn" data-screen="photo"></button>
  <button id="nav-number" class="nav-btn" data-screen="number"></button>
  <button id="nav-kana"   class="nav-btn" data-screen="kana"></button>
  <button id="nav-set"    class="nav-btn hidden" data-screen="set"></button>
</nav>

<div id="toast" class="toast"></div>

<script src="audio.js"></script>
<script src="tap.js"></script>
<script src="i18n.js"></script>
<script src="screens/router.js"></script>
<script src="screens/yesno.js"></script>
<script src="screens/health.js"></script>
<script src="screens/photo.js"></script>
<script src="screens/number.js"></script>
<script src="screens/kana.js"></script>
<script src="app.js"></script>
<!-- Farcaster Mini App SDK・読み込み完了を通知しスプラッシュを閉じる（Farcaster外では無害にスキップ）🔴web側専用 -->
<script type="module">
  try {
    const { sdk } = await import("https://esm.sh/@farcaster/miniapp-sdk");
    await sdk.actions.ready();
  } catch (e) { /* Farcaster外では何もしない */ }
</script>
</body>
</html>
